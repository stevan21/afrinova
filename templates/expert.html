{% load static %}
<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>AFRINOVA — Espace Expert</title>
  <meta name="robots" content="noindex,nofollow" />
  <link rel="icon" type="image/svg+xml" href="{% static 'assets/favicon.svg' %}" />
  <link rel="icon" type="image/x-icon" href="{% static 'favicon.ico' %}" />
  <meta name="theme-color" content="#1B2A63" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Poppins:wght@600;700;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="{% static 'css/admin.css' %}" />
  <link rel="stylesheet" href="{% static 'css/expert.css' %}" />
</head>
<body>

  <!-- ============ CONNEXION ============ -->
  <div class="login-wrap" id="login">
    <form class="login-card" id="loginForm">
      <img src="{% static 'assets/logo.jpeg' %}" alt="AFRINOVA" />
      <h1>Espace Expert</h1>
      <p>Connectez-vous avec votre compte membre.</p>
      <div class="field">
        <label for="loginUser">Identifiant</label>
        <input type="text" id="loginUser" placeholder="jean" autocomplete="username" required />
      </div>
      <div class="field">
        <label for="loginCode">Mot de passe</label>
        <input type="password" id="loginCode" placeholder="••••••••" autocomplete="current-password" required />
      </div>
      <button type="submit" class="btn btn-primary" style="width:100%">Se connecter</button>
      <p class="login-err" id="loginErr" hidden>Identifiants incorrects.</p>
    </form>
  </div>

  <!-- ============ APPLICATION ============ -->
  <div class="app" id="app" hidden>
    <div class="backdrop" id="backdrop"></div>
    <aside class="sidebar" id="sidebar">
      <div class="side-brand">
        <img src="{% static 'assets/logo.jpeg' %}" alt="AFRINOVA" />
        <div><b>AFRI<span>NOVA</span></b><small>Espace Expert</small></div>
      </div>
      <nav class="side-nav" id="sideNav">
        <button data-view="dashboard" class="active">
          <svg viewBox="0 0 24 24" fill="none"><rect x="3" y="3" width="7" height="9" rx="1.5" stroke="currentColor" stroke-width="1.8"/><rect x="14" y="3" width="7" height="5" rx="1.5" stroke="currentColor" stroke-width="1.8"/><rect x="14" y="12" width="7" height="9" rx="1.5" stroke="currentColor" stroke-width="1.8"/><rect x="3" y="16" width="7" height="5" rx="1.5" stroke="currentColor" stroke-width="1.8"/></svg>
          Tableau de bord
        </button>
        <button data-view="service">
          <svg viewBox="0 0 24 24" fill="none"><path d="M3 9l9-6 9 6v11a1 1 0 0 1-1 1h-5v-6H9v6H4a1 1 0 0 1-1-1V9Z" stroke="currentColor" stroke-width="1.7" stroke-linejoin="round"/></svg>
          Ma page service
        </button>
        <button data-view="location" id="navLocation" hidden>
          <svg viewBox="0 0 24 24" fill="none"><path d="M3 13l1.5-4.5A2 2 0 0 1 6.4 7h11.2a2 2 0 0 1 1.9 1.5L21 13v5h-2v-2H5v2H3v-5Z" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"/><circle cx="7" cy="16" r="1.3" fill="currentColor"/><circle cx="17" cy="16" r="1.3" fill="currentColor"/></svg>
          Mes véhicules
        </button>
        <button data-view="reservations" id="navReservations" hidden>
          <svg viewBox="0 0 24 24" fill="none"><rect x="3" y="5" width="18" height="16" rx="2" stroke="currentColor" stroke-width="1.8"/><path d="M3 10h18M8 3v4M16 3v4" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/><path d="m9 15 2 2 4-4" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg>
          Réservations
        </button>
        <button data-view="notes">
          <svg viewBox="0 0 24 24" fill="none"><rect x="4" y="3" width="16" height="18" rx="2" stroke="currentColor" stroke-width="1.8"/><path d="M8 8h8M8 12h8M8 16h4" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg>
          Notes
        </button>
        <button data-view="rapports">
          <svg viewBox="0 0 24 24" fill="none"><path d="M6 3h9l4 4v14H6V3Z" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"/><path d="M14 3v5h5M9 13v4M12 11v6M15 15v2" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg>
          Rapports
        </button>
        <button data-view="messages">
          <svg viewBox="0 0 24 24" fill="none"><path d="M21 11.5a8.4 8.4 0 0 1-8.5 8.5 8.5 8.5 0 0 1-3.7-.84L3 21l1.84-5.8A8.5 8.5 0 1 1 21 11.5Z" stroke="currentColor" stroke-width="1.7" stroke-linejoin="round"/></svg>
          Messages
        </button>
      </nav>
      <button class="logout" id="logout">
        <svg viewBox="0 0 24 24" fill="none" width="18" height="18"><path d="M14 8V6a2 2 0 0 0-2-2H6a2 2 0 0 0-2 2v12a2 2 0 0 0 2 2h6a2 2 0 0 0 2-2v-2M9 12h11m0 0-3-3m3 3-3 3" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg>
        Déconnexion
      </button>
    </aside>

    <div class="content">
      <header class="topbar">
        <button class="side-toggle" id="sideToggle" aria-label="Menu">☰</button>
        <h2 id="viewTitle">Tableau de bord</h2>
        <a class="view-site" href="index.html" target="_blank" rel="noopener">Voir le site ↗</a>
      </header>
      <section class="view" id="view"></section>
    </div>
  </div>

  <div class="toast" id="toast"></div>

  <script src="{% static 'js/api.js' %}"></script>
  <script src="{% static 'js/expert.js' %}"></script>
</body>
</html>
