server {
    listen 80;
    server_name SERVER_NAME;

    # APRÈS avoir lancé certbot, activez HTTP/2 sur le bloc 443 qu'il ajoute :
    #     listen 443 ssl http2;        au lieu de     listen 443 ssl;
    # Sans cela le navigateur reste en HTTP/1.1 et ouvre jusqu'à six
    # connexions, chacune avec sa poignée TLS, pour une dizaine de fichiers.
    # (nginx 1.25.1+ accepte la forme « http2 on; » sur une ligne séparée.)

    # Autorise l'upload de photos (expertises / membres) et des vidéos de véhicules.
    # L'espace admin refuse déjà les clips au-delà de 30 Mo : on garde une marge.
    client_max_body_size 40M;

    # Photos envoyées : servies directement par nginx. Django les rendait via
    # django.views.static.serve, sans en-tête de cache et en occupant un worker
    # gunicorn pour chaque image.
    location /media/ {
        alias /opt/afrinova/media/;
        expires 30d;
        add_header Cache-Control "public";
        access_log off;
    }

    location / {
        proxy_pass http://unix:/opt/afrinova/afrinova.sock;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
