server {
    listen 80;
    server_name SERVER_NAME;

    # Autorise l'upload de photos (expertises / membres)
    client_max_body_size 20M;

    # Photos envoyées : servies directement par nginx. Django les rendait via
    # django.views.static.serve, sans en-tête de cache et en occupant un worker
    # gunicorn pour chaque image.
    location /media/ {
        alias /opt/afrinova/media/;
        expires 30d;
        add_header Cache-Control "public";
        access_log off;
    }

    location / {
        proxy_pass http://unix:/opt/afrinova/afrinova.sock;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
