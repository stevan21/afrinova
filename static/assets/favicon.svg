<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <title>AFRINOVA</title>
  <!-- fond arrondi -->
  <rect width="64" height="64" rx="14" fill="#ffffff"/>
  <!-- swoosh (courbe du logo) -->
  <path d="M9 41 Q32 26 55 39" fill="none" stroke="#1B2A63" stroke-width="3.4" stroke-linecap="round"/>
  <!-- jambe gauche du A : bleu marine -->
  <path d="M13 53 L31 11" fill="none" stroke="#1B2A63" stroke-width="8" stroke-linecap="round"/>
  <!-- jambe droite du A : orange -->
  <path d="M33 11 L51 53" fill="none" stroke="#F47920" stroke-width="8" stroke-linecap="round"/>
  <!-- fenêtre (maison) -->
  <rect x="27" y="40" width="10" height="10" rx="1.4" fill="#1B2A63"/>
  <line x1="32" y1="40" x2="32" y2="50" stroke="#ffffff" stroke-width="1.3"/>
  <line x1="27" y1="45" x2="37" y2="45" stroke="#ffffff" stroke-width="1.3"/>
</svg>
